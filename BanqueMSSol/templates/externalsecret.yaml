{{/*
externalsecret.yaml — gestion des secrets via Vault + External Secrets Operator.

POURQUOI : un mot de passe ne doit JAMAIS être en clair dans Git. Le secret vit
dans Vault (coffre-fort). ESO (un opérateur installé dans le cluster) lit Vault
et fabrique tout seul un Secret Kubernetes. Notre chart ne contient donc que des
RÉFÉRENCES (chemins, noms de clés), pas les valeurs sensibles.

Deux objets (ce sont des CRD apportées par ESO) :
- SecretStore  : dit OÙ est Vault et COMMENT s'y authentifier.
- ExternalSecret : dit QUELLES clés récupérer et sous quel nom de Secret K8s.
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "banquemssol.fullname" . }}-vault
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banquemssol.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vault.server | quote }}
      path: {{ .Values.externalSecrets.vault.path | quote }}
      version: {{ .Values.externalSecrets.vault.version | quote }}
      auth:
        # Auth "kubernetes" : Vault vérifie le token du ServiceAccount du pod,
        # pas besoin de stocker un mot de passe d'accès à Vault.
        kubernetes:
          mountPath: {{ .Values.externalSecrets.vault.auth.mountPath | quote }}
          role: {{ .Values.externalSecrets.vault.auth.role | quote }}
          serviceAccountRef:
            name: {{ include "banquemssol.serviceAccountName" . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "banquemssol.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banquemssol.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "banquemssol.fullname" . }}-vault
    kind: SecretStore
  # Le Secret K8s qu'ESO va créer/maintenir (consommé en env par le Deployment).
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecrets.vaultSecretPath | quote }}
        property: {{ .remoteKey }}
    {{- end }}
{{- end }}
