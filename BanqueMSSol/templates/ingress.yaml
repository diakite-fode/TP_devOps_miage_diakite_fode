{{/*
ingress.yaml — la porte d'entrée HTTP depuis l'extérieur du cluster.
L'Ingress dit au controller (ici Traefik) : "le trafic pour tel hostname doit
aller vers tel Service". Le hostname est paramétrable via values (ingress.host).
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "banquemssol.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banquemssol.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "banquemssol.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  # TLS (HTTPS) — bonus. Le certificat est attendu dans ce Secret.
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "banquemssol.fullname" . }}-tls
  {{- end }}
{{- end }}
