{{/*
serviceaccount.yaml — RBAC (Role-Based Access Control) = "qui a le droit de
faire quoi" dans le cluster.

- ServiceAccount : l'identité sous laquelle tourne le pod.
- Role : un ensemble de permissions, LIMITÉ à ce namespace.
- RoleBinding : attache le Role au ServiceAccount.

Principe du MOINDRE PRIVILÈGE : on ne donne que le strict nécessaire. Ici, la
lecture seule des ConfigMaps/Secrets de son propre namespace (ce dont une appli
Spring peut avoir besoin pour relire sa config). Rien de plus (pas d'écriture,
pas d'accès cluster-wide).
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "banquemssol.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banquemssol.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "banquemssol.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banquemssol.labels" . | nindent 4 }}
rules:
  # Lecture seule (get/list/watch) des ConfigMaps et Secrets de ce namespace.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "banquemssol.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banquemssol.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "banquemssol.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "banquemssol.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
